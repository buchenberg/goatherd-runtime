name: ci

on:
  push:
    branches: [main]
    # Every tag triggers CI: a nested module tags as `<subdir>/vX.Y.Z`
    # (e.g. sandbox/landlock/v0.1.0), which a `v*` filter would silently skip.
    tags: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: gofmt (must be empty)
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt found unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 -race ./...
        env:
          CGO_ENABLED: '1'

      - name: build
        run: go build -trimpath ./...

      # `go test ./...` from the root does NOT cross a nested module boundary,
      # so the nested modules (e.g. sandbox/landlock) were previously tested by
      # nothing. Build, vet, and test each one explicitly. Linux-only tests are
      # excluded on other OSes by their build tags.
      - name: nested modules (build, vet, test)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            if [ "$dir" = "." ]; then continue; fi
            echo "::group::nested module ${dir}"
            ( cd "$dir" && go build ./... && go vet ./... && go test -count=1 ./... )
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path './.git/*' -not -path '*/testdata/*' -not -path './vendor/*' | sort)

  release-verify:
    name: release verify (tagged module)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: checkout the tag
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # A tagged module must be consumable from the module proxy's point of
      # view: no replace directives (a relative ../.. replace makes the
      # published module unbuildable). Scan EVERY go.mod in the tagged tree,
      # not just the root -- a nested module's replace shipped unnoticed once
      # because this loop only looked at ./go.mod.
      - name: no replace directives in any tagged module
        run: |
          fail=0
          while IFS= read -r mod; do
            if grep -nE '^[[:space:]]*replace[[:space:]]' "$mod"; then
              echo "::error::$mod in tag ${GITHUB_REF_NAME} contains a replace directive -- the published module would be unbuildable; pin a tagged dependency instead"
              fail=1
            fi
          done < <(find . -name go.mod -not -path './.git/*' -not -path '*/testdata/*' -not -path './vendor/*' | sort)
          exit $fail

      # Map the tag to the module it releases and prove it resolves from a
      # clean consumer. A root tag is `vX.Y.Z`; a nested module tags its
      # subdirectory (`<subdir>/vX.Y.Z`), whose module path is
      # `<repo-module>/<subdir>`.
      - name: module resolves from a clean consumer
        run: |
          set -euo pipefail
          REPO_MODULE="github.com/buchenberg/goatherd-runtime"
          tag="${GITHUB_REF_NAME}"
          # A root tag is `vX.Y.Z`; a nested module tags its subdirectory
          # (`<subdir>/vX.Y.Z`, module path `<repo-module>/<subdir>`). Split on
          # the slash, not on a leading `v`: a subdir can start with `v`
          # (e.g. `vendor/.../v1.2.3`), which a `v*` test would misread as root.
          if [[ "$tag" == */* ]]; then
            subdir="${tag%/*}"
            ver="${tag##*/}"
            mod="$REPO_MODULE/$subdir"
          else
            mod="$REPO_MODULE"
            ver="$tag"
          fi
          # `tags: ['**']` fires this job for every tag; only version tags name
          # a module release, so skip the rest rather than fabricate one.
          if [[ ! "$ver" =~ ^v[0-9] ]]; then
            echo "tag ${tag} is not a module version tag (last segment ${ver}); nothing to verify"
            exit 0
          fi
          echo "tag ${tag} -> ${mod}@${ver}"
          ( cd "$(mktemp -d)" && go mod init verify >/dev/null && \
            go get "${mod}@${ver}" )
          echo "tag ${tag} resolves end-to-end from a clean module context"
