name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: gofmt (must be empty)
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt found unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 -race ./...
        env:
          CGO_ENABLED: '1'

      - name: build
        run: go build -trimpath ./...

  release-verify:
    name: release verify (tagged module)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: checkout the tag
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # A tagged module must be consumable from the module proxy's point of
      # view: no replace directives (a relative ../.. replace makes the
      # published module unbuildable). Remove the local-dev replace before
      # tagging, pinning `require ... vX.Y.Z` to a tagged kernel instead.
      - name: no replace directives in tagged modules
        run: |
          fail=0
          for mod in go.mod; do
            if grep -nE '^\s*replace\s' "$mod"; then
              echo "::error::$mod in tag ${GITHUB_REF_NAME} contains a replace directive -- the published module would be unbuildable; pin a tagged kernel instead"
              fail=1
            fi
          done
          exit $fail

      - name: module resolves and builds from a clean consumer
        run: |
          tag="${GITHUB_REF_NAME}"
          ( cd "$(mktemp -d)" && go mod init verify >/dev/null && \
            go get "github.com/buchenberg/shepherd-runtime-go@${tag}" )
          echo "tag ${GITHUB_REF_NAME} resolves end-to-end from a clean module context"
